<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebSocket Client - 256 Colors</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
			background-color: #1e1e1e;
			overflow: hidden;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		canvas {
			width: 100%;
			height: 100%;
			object-fit: contain;
			image-rendering: pixelated;
		}
	</style>
</head>

<body>

	<canvas id="monitor" width="256" height="256"></canvas>


	<script>
		const canvas = document.getElementById('monitor');
		const ctx = canvas.getContext('2d', {alpha: false});

		const rgbMap = new Uint8Array(256 * 3);

		const basicHex = [
			0x000000, 0x0000AA, 0x00AA00, 0x00AAAA,
			0xAA0000, 0xAA00AA, 0xAA5500, 0xAAAAAA,
			0x555555, 0x5555FF, 0x55FF55, 0x55FFFF,
			0xFF5555, 0xFF55FF, 0xFFFF55, 0xFFFFFF
		];

		let mapIdx = 0;
		for (let i = 0; i < 16; i++) {
			rgbMap[mapIdx++] = (basicHex[i] >> 16) & 255; // R
			rgbMap[mapIdx++] = (basicHex[i] >> 8) & 255;  // G
			rgbMap[mapIdx++] = basicHex[i] & 255;         // B
		}

		const vals = [0, 95, 135, 175, 215, 255];
		for (let r of vals) {
			for (let g of vals) {
				for (let b of vals) {
					rgbMap[mapIdx++] = r;
					rgbMap[mapIdx++] = g;
					rgbMap[mapIdx++] = b;
				}
			}
		}

		for (let i = 0; i < 24; i++) {
			const v = 8 + i * 10;
			rgbMap[mapIdx++] = v;
			rgbMap[mapIdx++] = v;
			rgbMap[mapIdx++] = v;
		}

		let ws;
		function connect() {
			ws = new WebSocket("ws://localhost:8080/ws");

			ws.binaryType = "arraybuffer";

			ws.onopen = function () {
				console.log("Connected to WebSocket server (Binary Mode)");
			};

			ws.onmessage = function (event) {
				const buffer = new Uint8Array(event.data);

				const imgData = ctx.getImageData(0, 0, 256, 256);
				const pixels = imgData.data;

				for (let i = 0; i < buffer.length; i += 3) {
					const x = buffer[i];
					const y = buffer[i + 1];
					const colorID = buffer[i + 2];

					const colorIdx = colorID * 3;
					const r = rgbMap[colorIdx];
					const g = rgbMap[colorIdx + 1];
					const b = rgbMap[colorIdx + 2];

					const pixelIdx = (y * 256 + x) * 4;

					pixels[pixelIdx] = r;
					pixels[pixelIdx + 1] = g;
					pixels[pixelIdx + 2] = b;
					pixels[pixelIdx + 3] = 255;
				}

				ctx.putImageData(imgData, 0, 0);
			};

			ws.onclose = function () {
				console.log("WebSocket connection closed, retrying...");
				setTimeout(connect, 1000);
			};

			ws.onerror = function (error) {
				console.error("WebSocket error:", error);
			};
		}

		connect();
	</script>

</body>

</html>
