<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebSocket Client</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
			background-color: #1e1e1e;
			overflow: hidden;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		canvas {
			width: 100%;
			height: 100%;

			object-fit: contain;

			image-rendering: pixelated;
		}
	</style>
</head>

<body>

	<canvas id="monitor" width="256" height="256"></canvas>

	<script>
		let currentColor;

		const colorMap = new Map();
		colorMap.set("0", '#000000'); // Black
		colorMap.set("1", '#0000AA'); // Dark Blue
		colorMap.set("2", '#00AA00'); // Dark Green
		colorMap.set("3", '#00AAAA'); // Dark Cyan
		colorMap.set("4", '#AA0000'); // Dark Red
		colorMap.set("5", '#AA00AA'); // Dark Magenta
		colorMap.set("6", '#AA5500'); // Brown
		colorMap.set("7", '#AAAAAA'); // Light Gray
		colorMap.set("8", '#555555'); // Dark Gray
		colorMap.set("9", '#5555FF'); // Bright Blue
		colorMap.set("10", '#55FF55'); // Bright Green
		colorMap.set("11", '#55FFFF'); // Bright Cyan
		colorMap.set("12", '#FF5555'); // Bright Red
		colorMap.set("13", '#FF55FF'); // Bright Magenta
		colorMap.set("14", '#FFFF55'); // Yellow
		colorMap.set("15", '#FFFFFF'); // White

		const canvas = document.getElementById('monitor');
		const ctx = canvas.getContext('2d', {alpha: false});

		let ws;

		function connect() {
			ws = new WebSocket("ws://localhost:8080/ws");

			ws.onopen = function () {
				console.log("Connected to WebSocket server");
			};

			ws.onmessage = function (event) {
				const coords = JSON.parse(event.data);

				if (colorMap.has(coords.Color)) {
					currentColor = colorMap.get(coords.Color);
				} else {
					currentColor = "black";
				}
				ctx.fillStyle = currentColor;

				ctx.fillRect(coords.X, coords.Y, 1, 1);
			};

			ws.onclose = function () {
				console.log("WebSocket connection closed, retrying...");
				setTimeout(connect, 1000);
			};

			ws.onerror = function (error) {
				console.error("WebSocket error:", error);
			};
		}

		connect();
	</script>
</body>

</html>
